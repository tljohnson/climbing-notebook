name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test on iOS Simulator
        run: RESULT_BUNDLE_PATH="$GITHUB_WORKSPACE/.build/TestResults.xcresult" Scripts/test-ios.sh

      - name: Enforce line coverage
        if: always()
        run: Scripts/check-coverage.sh "$GITHUB_WORKSPACE/.build/TestResults.xcresult"

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: .build/TestResults.xcresult
          retention-days: 3
          if-no-files-found: ignore
