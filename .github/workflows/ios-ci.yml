name: iOS MVP Core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream; Node.js 24
      - name: Inspect native environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Resolve reviewed dependency
        run: xcodebuild -resolvePackageDependencies -project ClimbingNotebook.xcodeproj -scheme ClimbingNotebook -derivedDataPath .build/DerivedData -onlyUsePackageVersionsFromResolvedFile
      - name: Test MVP core regressions
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].values.flatten; device = devices.find { |d| d["name"].start_with?("iPhone") }; abort "No iPhone simulator installed" unless device; puts device["udid"]')"
          export SIMULATOR_ID
          export RESULT_BUNDLE_PATH=.build/CI.xcresult
          bash Scripts/test-ios.sh --suite core -quiet -disableAutomaticPackageResolution
      - name: Enforce first-party coverage
        run: |
          bash Scripts/check-coverage.sh --self-test
          bash Scripts/check-coverage.sh .build/CI.xcresult
